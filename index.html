<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AOVE 2026</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <img src="images/logo.png" alt="AOVE Logo" class="logo">
    <div class="lang-switch">
      <select id="lang-select" aria-label="Language selection">
        <option value="ca">Català</option>
        <option value="en">English</option>
        <option value="nl">Nederlands</option>
      </select>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <img src="images/botella-aceite.jpg" alt="Botella de Aceite 2026" class="hero-img">
      <h1 data-i18n="hero_title">AOVE Collita 2026</h1>
      <p class="subtitle" data-i18n="hero_subtitle">Oli d'oliva verge extra d'alta qualitat.</p>
    </section>

    <article class="story-card">
      <h2 data-i18n="story_title">El Nostre Relat</h2>
      <p data-i18n="story_p1"></p>
      <img src="images/olivar-1.jpg" alt="Olivar tradicional" class="body-img">
      <p data-i18n="story_p2"></p>
      <a href="pages/finca.html" class="btn" data-i18n="cta_finca">Descobreix la nostra Finca</a>
    </article>
  </main>

  <footer>
    <p data-i18n="footer_text">© 2026 AOVE Artesà</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
